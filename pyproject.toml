[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ease-disaster-vqa"
version = "1.0.0"
description = "EASE: Evidence-to-Answer Supervision for Disaster-Scene VLM Adaptation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0", "pandas>=2.2", "pillow>=10.4", "pyyaml>=6.0",
    "pyarrow>=17", "pydantic>=2.10",
]

[project.optional-dependencies]
ease2026 = [
    "torch>=2.8", "torchvision>=0.23", "transformers>=5.0",
    "peft>=0.17", "accelerate>=1.7", "bitsandbytes>=0.45",
]
analysis = ["matplotlib>=3.9"]
dev = ["pytest>=8.3"]

[project.scripts]
floodnet-rcmtd = "floodnet_rcmtd.cli:main"
ease2026 = "floodnet_rcmtd.ease2026.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
